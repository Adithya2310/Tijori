name: Release

# Two independent jobs on every push to main:
# - sdk: builds and tests the @tijori/* packages from sdk/ (local source), then publishes with Changesets:
#   pending changesets -> a "Version Tijori packages" pull request; versions not on npm -> published with npm
#   provenance. Publishing runs only when the NPM_TOKEN repository secret is set.
# - app: installs the Tijori app at the repository root from the npm registry (it is a merchant of the
#   published packages), then lints, builds and tests it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20
          cache: npm
          cache-dependency-path: sdk/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Skip publishing without NPM_TOKEN
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set, so nothing was published."
      - name: Version or publish
        if: env.NPM_TOKEN != ''
        uses: changesets/action@v1
        with:
          cwd: sdk
          version: npx changeset version
          publish: npm run release
          title: Version Tijori packages
          commit: Version Tijori packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20
          cache: npm
      - run: npm ci # @tijori/* come from the npm registry
      - name: Cache pinned model assets
        uses: actions/cache@v4
        with:
          path: public/tijori-assets
          key: tijori-assets-${{ hashFiles('package-lock.json') }}
      - run: npm run lint
      - run: npm run build # prebuild runs the published `tijori-client prepare-assets`
      - run: npm test
